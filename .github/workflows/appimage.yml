name: Unified GUI AppImage
on:
  push:
    branches: [main, feat/unified-gui-appimage]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage and validate engine, GUI and rendered layouts
        run: ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ApexSenseBridge-Linux-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Upload rendered UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-regressions
          retention-days: 14
          path: dist/visual-tests/
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApexSenseBridge-Linux-x86_64-AppImage
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
