name: Unified GUI AppImage
on:
  push:
    branches: [main, feat/unified-gui-appimage]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in Debian 13
        run: ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ApexSenseBridge-Linux-x86_64-AppImage
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApexSenseBridge-Linux-x86_64-AppImage
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
